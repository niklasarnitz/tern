included:
  - apple/Sources
  - apple/Tests
excluded:
  - apple/Generated
  - apple/.build
strict: true
opt_in_rules:
  - array_init
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - last_where
  - legacy_multiple
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - sorted_imports
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - yoda_condition
analyzer_rules:
  - unused_declaration
  - unused_import
force_cast: error
force_try: error
force_unwrapping: error
line_length:
  warning: 120
  error: 160
  ignores_comments: true
identifier_name:
  min_length: 2
  excluded:
    - id
