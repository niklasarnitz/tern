[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mail-model = { path = "crates/mail-model" }
mail-db = { path = "crates/mail-db" }
mail-imap = { path = "crates/mail-imap" }
mail-mime = { path = "crates/mail-mime" }
mail-sync = { path = "crates/mail-sync" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uniffi = "0.32"
